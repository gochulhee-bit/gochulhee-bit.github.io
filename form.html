<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>양식</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light;--fg:#31333f;--muted:#8b8d96;--line:#d6d6d9;--field:#f0f2f6;--accent:#ff4b4b}
body{margin:0;background:#fff;color:var(--fg);font:15px/1.6 "Source Sans 3","Noto Sans KR",sans-serif}
[hidden]{display:none!important}
main{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
nav{display:flex;gap:8px;margin-bottom:12px}
nav a{padding:4px 14px;border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none;font-size:14px}
nav a[aria-current]{border-color:var(--accent);color:var(--accent);font-weight:700}
h1{font-size:32px;margin:0 0 16px}
form{display:flex;flex-wrap:wrap;gap:10px}
input[type=file]{flex:1;min-width:0;background:var(--field);border-radius:8px;padding:9px;font:inherit}
button{border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;padding:6px 18px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.small{font-size:12.5px;color:var(--muted)}
#msg{font-weight:700;min-height:1.6em}
.table{overflow-x:auto;border:1px solid #e6e7ea;border-radius:8px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid #e6e7ea}
th{background:var(--field)}
td:first-child{word-break:break-all}
td:not(:first-child){white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td button{padding:1px 12px;font-size:13px}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;width:min(340px,calc(100vw - 64px));color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog p{margin:0 0 10px;word-break:break-all}
dialog input{box-sizing:border-box;width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
#delmsg{color:#b83a40;font-size:13px;min-height:1.6em;margin:6px 0}
.actions{display:flex;justify-content:flex-end;gap:8px}
.pages,main>nav{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
main{padding-bottom:90px}
</style></head><body>
<main>
  <nav><a href="./">자체점검</a><a href="form.html" aria-current="page">양식</a></nav>
  <h1>📄 양식</h1>
  <form id="form">
    <input type="file" id="file" aria-label="올릴 양식 파일" accept=".hwp,.hwpx,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" required>
    <button id="send" disabled>업로드</button>
  </form>
  <p class="small">한글, PDF, 워드, 엑셀, 파워포인트 파일(10MB 이하)을 올릴 수 있습니다. 올린 파일은 누구나 내려받을 수 있으니 개인정보가 담긴 파일은 올리지 마세요. 삭제하려면 비밀번호가 필요합니다.</p>
  <p id="msg" role="status"></p>
  <div class="table" id="table" hidden><table>
    <thead><tr><th>파일명</th><th>크기</th><th>올린 날짜</th><th>받기</th><th>삭제</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<dialog id="dialog" aria-labelledby="delname">
  <form id="delform">
    <p><b id="delname"></b> 파일을 삭제합니다.</p>
    <input type="password" id="password" aria-label="삭제 비밀번호" placeholder="삭제 비밀번호" autocomplete="off" required>
    <p id="delmsg" role="alert"></p>
    <div class="actions"><button type="button" id="cancel">취소</button><button id="confirm">삭제</button></div>
  </form>
</dialog>
<script>
// Cloudflare Worker 주소(https://….workers.dev)를 따옴표 안에 넣으세요.
const API_URL = "";
const BASE = API_URL.replace(/\/+$/, "");
const $ = id => document.getElementById(id);
const say = text => $("msg").textContent = text;
let target = "";
function show(files) {
  $("rows").replaceChildren(...files.map(f => {
    const tr = document.createElement("tr");
    [f.name, f.size < 1048576 ? `${Math.max(1, Math.round(f.size / 1024))} KB` : `${(f.size / 1048576).toFixed(1)} MB`,
      new Date(f.date).toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul" })].forEach(v => tr.insertCell().textContent = v);
    const cell = tr.insertCell();
    if (String(f.url).startsWith(BASE + "/file/")) {
      const a = document.createElement("a"); a.href = f.url; a.textContent = "내려받기"; a.rel = "noopener"; cell.append(a);
    }
    const del = document.createElement("button");
    del.type = "button"; del.textContent = "삭제";
    del.setAttribute("aria-label", `${f.name} 삭제`);
    del.onclick = () => {
      target = f.id; $("delname").textContent = f.name;
      $("delform").reset(); $("delmsg").textContent = ""; $("dialog").showModal();
    };
    tr.insertCell().append(del);
    return tr;
  }));
  $("table").hidden = !files.length;
  say(files.length ? "" : "아직 올라온 양식이 없습니다.");
}
async function call(path, options) {
  const response = await fetch(BASE + path, options);
  const result = await response.json();
  if (!result.ok) throw new Error(result.error);
  return result.files;
}
async function load() {
  if (!API_URL) return say("업로드 기능을 준비 중입니다.");
  say("목록을 불러오는 중입니다.");
  try { show(await call("/files")); $("send").disabled = false; }
  catch { say("목록을 불러오지 못했습니다. 새로고침해 주세요."); }
}
$("form").addEventListener("submit", async event => {
  event.preventDefault();
  const file = $("file").files[0];
  if (!file || !API_URL) return;
  if (file.size > 10 * 1048576) return say("파일은 10MB 이하만 올릴 수 있습니다.");
  $("send").disabled = true; say("올리는 중입니다.");
  try {
    show(await call(`/upload?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file }));
    $("form").reset(); say("올렸습니다.");
  } catch (e) {
    say(e instanceof TypeError ? "연결하지 못했습니다. 목록을 새로고침해 올라갔는지 확인하세요." : e.message || "올리지 못했습니다.");
  }
  $("send").disabled = false;
});
$("cancel").onclick = () => $("dialog").close();
$("delform").addEventListener("submit", async event => {
  event.preventDefault();
  $("confirm").disabled = true; $("delmsg").textContent = "삭제하는 중입니다.";
  try {
    show(await call("/delete", { method: "POST", body: JSON.stringify({ id: target, password: $("password").value }) }));
    $("dialog").close(); say("삭제했습니다.");
  } catch (e) {
    $("delmsg").textContent = e instanceof TypeError ? "연결하지 못했습니다. 새로고침해 확인하세요." : e.message || "삭제하지 못했습니다.";
    $("password").value = "";
  }
  $("confirm").disabled = false;
});
load();
</script>
</body></html>
