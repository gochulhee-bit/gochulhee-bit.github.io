<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="theme.js?v=3"></script><script src="keys.js"></script><title>양식</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light;--fg:#31333f;--muted:#8b8d96;--line:#d6d6d9;--field:#f0f2f6;--accent:#ff4b4b}
body{margin:0;background:var(--bg,#fff);color:var(--fg);font:15px/1.6 "Source Sans 3","Noto Sans KR",sans-serif}
[hidden]{display:none!important}
main{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
nav{display:flex;gap:8px;margin-bottom:12px}
nav a{padding:4px 14px;border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none;font-size:14px}
nav a[aria-current]{border-color:var(--accent);color:var(--accent);font-weight:700}
h1{font-size:32px;margin:0 0 16px}
form{display:flex;flex-wrap:wrap;gap:10px}
input[type=file]{flex:1;min-width:0;background:var(--field);border-radius:8px;padding:9px;font:inherit}
button{border:1px solid var(--line);background:var(--bg,#fff);color:var(--fg);border-radius:8px;padding:6px 18px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.small{font-size:12.5px;color:var(--muted)}
#msg{font-weight:700;min-height:1.6em}
#search{box-sizing:border-box;width:100%;max-width:420px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
.table{overflow-x:auto;border:1px solid var(--tline,#e6e7ea);border-radius:8px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--tline,#e6e7ea)}
th{background:var(--field)}
td:first-child{word-break:break-all}
td:not(:first-child){white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td button{padding:1px 12px;font-size:13px}
.view{display:inline-block;margin-right:10px;padding:1px 12px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-weight:700;font-size:13px;text-decoration:none}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;width:min(340px,calc(100vw - 64px));color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog p{margin:0 0 10px;word-break:break-all}
dialog input{box-sizing:border-box;width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
#delmsg{color:var(--alert-fg,#b83a40);font-size:13px;min-height:1.6em;margin:6px 0}
.actions{display:flex;justify-content:flex-end;gap:8px}
.pages,main>nav{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;padding:6px;background:var(--bg,#fff);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
main{padding-bottom:90px}
/* 왼쪽 아래 페이지 버튼: 세 페이지 모두 같은 크기 */
body nav a[href]{padding:2px 14px;font-size:14px;line-height:22px}
</style></head><body>
<main>
  <nav><a href="./">자체점검</a><a href="calendar.html">달력</a><a href="form.html" aria-current="page">양식</a><a href="postpone.html">연기</a></nav>
  <h1>📄 양식</h1>
  <form id="form">
    <input type="file" id="file" aria-label="올릴 양식 파일" accept=".hwp,.hwpx,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" required>
    <button id="send" disabled>업로드</button>
  </form>
  <p class="small">한글, PDF, 워드, 엑셀, 파워포인트 파일(10MB 이하)을 올릴 수 있습니다. 올린 파일은 누구나 보고 내려받을 수 있으니 개인정보가 담긴 파일은 올리지 마세요. <b>보기·인쇄</b>: PDF는 브라우저, 한글·엑셀(.xlsx)은 홈페이지 미리보기(원본과 모양이 다를 수 있음), 워드·파워포인트·구형 엑셀(.xls)은 Microsoft 온라인 뷰어로 엽니다(사내망에서 막힐 수 있으며, 이때는 PDF로 올려 주세요). 삭제하려면 비밀번호가 필요합니다.</p>
  <p id="msg" role="status"></p>
  <input type="search" id="search" placeholder="🔍 파일명 검색" aria-label="파일명 검색" autocomplete="off" hidden>
  <p class="small" id="found" role="status"></p>
  <div class="table" id="table" hidden><table>
    <thead><tr><th>파일명</th><th>크기</th><th>올린 날짜</th><th>보기·받기</th><th>삭제</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<dialog id="dialog" aria-labelledby="delname">
  <form id="delform">
    <p><b id="delname"></b> 파일을 삭제합니다.</p>
    <input type="password" id="password" aria-label="삭제 비밀번호" placeholder="삭제 비밀번호" autocomplete="off" required>
    <p id="delmsg" role="alert"></p>
    <div class="actions"><button type="button" id="cancel">취소</button><button id="confirm">삭제</button></div>
  </form>
</dialog>
<script>
// Cloudflare Worker 주소(https://….workers.dev)를 따옴표 안에 넣으세요.
const API_URL = "https://selfchek-api.toorang2.workers.dev";
const BASE = API_URL.replace(/\/+$/, "");
const $ = id => document.getElementById(id);
const say = text => $("msg").textContent = text;
let target = "";
let all = [];
// 띄어쓰기·대소문자 구분 없이, 여러 낱말은 모두 들어간 파일만
const plain = text => String(text).normalize("NFC").toLowerCase().replace(/\s+/g, "");
function show(files) {
  all = files;
  $("search").hidden = !all.length;
  if (!all.length) $("search").value = "";
  draw();
  say(files.length ? "" : "아직 올라온 양식이 없습니다.");
}
function draw() {
  const words = $("search").value.trim().split(/\s+/).filter(Boolean).map(plain);
  const files = all.filter(f => words.every(w => plain(f.name).includes(w)));
  $("found").textContent = words.length ? (files.length ? `검색 결과 ${files.length}개 / 전체 ${all.length}개` : "검색 결과가 없습니다.") : "";
  $("rows").replaceChildren(...files.map(f => {
    const tr = document.createElement("tr");
    [f.name, f.size < 1048576 ? `${Math.max(1, Math.round(f.size / 1024))} KB` : `${(f.size / 1048576).toFixed(1)} MB`,
      new Date(f.date).toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul" })].forEach(v => tr.insertCell().textContent = v);
    const cell = tr.insertCell();
    if (String(f.view).startsWith(BASE + "/view/") && !/\.xlsx$/i.test(f.name)) {     // PDF는 브라우저에서, 오피스 문서는 Microsoft 뷰어에서
      const a = document.createElement("a");
      a.href = /\.pdf$/i.test(f.name) ? f.view : `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(f.view)}`;
      a.textContent = "보기·인쇄"; a.className = "view"; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.setAttribute("aria-label", `${f.name} 보기·인쇄`); cell.append(a);
    }
    if (String(f.url).startsWith(BASE + "/file/")) {
      const a = document.createElement("a"); a.href = f.url; a.textContent = "내려받기"; a.rel = "noopener"; cell.append(a);
    }
    const hwp = /\.(hwpx?|xlsx)$/i.test(f.name) && String(f.url).startsWith(BASE + "/file/") && /\/file\/([0-9a-f-]{36})$/i.exec(f.url);
    if (hwp) {                                            // 한글·엑셀 파일은 홈페이지의 미리보기에서
      const a = document.createElement("a");
      a.href = `viewer.html?id=${hwp[1]}&name=${encodeURIComponent(f.name)}`;
      a.textContent = "보기·인쇄"; a.className = "view"; a.target = "_blank"; a.rel = "noopener";
      a.setAttribute("aria-label", `${f.name} 보기·인쇄`); cell.prepend(a);
    }
    const del = document.createElement("button");
    del.type = "button"; del.textContent = "삭제";
    del.setAttribute("aria-label", `${f.name} 삭제`);
    del.onclick = () => {
      target = f.id; $("delname").textContent = f.name;
      $("delform").reset(); $("delmsg").textContent = ""; $("dialog").showModal();
    };
    tr.insertCell().append(del);
    return tr;
  }));
  $("table").hidden = !files.length;
}
$("search").oninput = draw;
async function call(path, options) {
  const response = await fetch(BASE + path, options);
  const result = await response.json();
  if (!result.ok) throw new Error(result.error);
  return result.files;
}
async function load() {
  if (!API_URL) return say("업로드 기능을 준비 중입니다.");
  say("목록을 불러오는 중입니다.");
  try { show(await call("/files")); $("send").disabled = false; }
  catch { say("목록을 불러오지 못했습니다. 새로고침해 주세요."); }
}
$("form").addEventListener("submit", async event => {
  event.preventDefault();
  const file = $("file").files[0];
  if (!file || !API_URL) return;
  if (file.size > 10 * 1048576) return say("파일은 10MB 이하만 올릴 수 있습니다.");
  $("send").disabled = true; say("올리는 중입니다.");
  try {
    show(await call(`/upload?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file }));
    $("form").reset(); say("올렸습니다.");
  } catch (e) {
    say(e instanceof TypeError ? "연결하지 못했습니다. 목록을 새로고침해 올라갔는지 확인하세요." : e.message || "올리지 못했습니다.");
  }
  $("send").disabled = false;
});
$("cancel").onclick = () => $("dialog").close();
$("delform").addEventListener("submit", async event => {
  event.preventDefault();
  $("confirm").disabled = true; $("delmsg").textContent = "삭제하는 중입니다.";
  try {
    show(await call("/delete", { method: "POST", body: JSON.stringify({ id: target, password: $("password").value }) }));
    $("dialog").close(); say("삭제했습니다.");
  } catch (e) {
    $("delmsg").textContent = e instanceof TypeError ? "연결하지 못했습니다. 새로고침해 확인하세요." : e.message || "삭제하지 못했습니다.";
    $("password").value = "";
  }
  $("confirm").disabled = false;
});
load();
</script>
</body></html>
