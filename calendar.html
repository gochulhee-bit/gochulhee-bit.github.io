<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달력</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light;--fg:#31333f;--muted:#8b8d96;--line:#e1e2e6;--field:#f0f2f6;--accent:#ff4b4b;--red:#c92f36;--blue:#0b62a8;--bluebg:#e8f2fc}
body{margin:0;background:#fff;color:var(--fg);font:14px/1.5 "Source Sans 3","Noto Sans KR",sans-serif}
main{max-width:1880px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
nav{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
nav a{padding:2px 14px;border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none}
nav a[aria-current]{border-color:var(--accent);color:var(--accent);font-weight:700}
h1{font-size:32px;margin:0 0 12px}
button{border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:8px;font:inherit;cursor:pointer;padding:4px 14px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.layout{display:grid;gap:24px}
.layout>*{min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.bar h2{margin:0;font-size:22px;min-width:7.5em;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:solid var(--line);border-width:1px 0 0 1px}
.grid>*{border:solid var(--line);border-width:0 1px 1px 0}
.head{background:var(--field);text-align:center;font-weight:700;padding:5px}
.day{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:78px;border-radius:0;padding:5px 6px;text-align:left;overflow:hidden}
.day b{font-size:15px;font-variant-numeric:tabular-nums}
.day span{font-size:11.5px;line-height:1.35;max-width:100%;word-break:keep-all;overflow-wrap:anywhere}
.sun{color:var(--red)}.sat{color:var(--blue)}
.day.off{background:#fff6f6}
.day.today b{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px}
.day[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--accent)}
.due{color:var(--fg)}
.count{background:var(--bluebg);color:var(--blue);border-radius:6px;padding:0 6px;font-weight:700}
aside{border-top:1px solid var(--line);padding-top:16px}
.day .chip{width:100%;box-sizing:border-box;border-radius:4px;padding:0 5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.chip.done{text-decoration:line-through;opacity:.55}
.day .chip{display:flex;align-items:baseline;gap:4px}
.day .chip>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:inherit}
.ip{font-size:9px!important;opacity:.7;font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums;user-select:none}
.day .chip .ip{flex:none;max-width:none}
.events .open .ip{margin-left:6px}
.duerow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 10px;width:150px}
.events{list-style:none;padding:0!important;display:grid;gap:6px}
aside .events{margin-bottom:8px}
.events li{display:flex;align-items:center;gap:8px}
.events button{padding:1px 10px;text-align:left}
.events .open{flex:1;min-width:0;overflow-wrap:anywhere;border-color:transparent}
#results{margin:0 0 12px;max-height:220px;overflow:auto}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;width:min(420px,calc(100vw - 64px));color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 12px;font-size:20px}
dialog label{display:block;margin:10px 0 3px;font-weight:700;font-size:13px}
dialog input[type=text],dialog input[type=date],dialog select,dialog textarea{box-sizing:border-box;width:100%;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{margin:0;position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0;inset:0;margin:0}
.swatches span{display:block;border-radius:6px;padding:3px 10px;border:2px solid transparent}
.swatches input:checked+span{border-color:var(--fg)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .primary{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#error{color:var(--red);margin:8px 0 0;font-size:13px}
aside h2{font-size:20px;margin:0 0 8px}
aside h3{font-size:15px;margin:18px 0 6px}
aside ul{margin:0;padding-left:18px}
.small{font-size:12px;color:var(--muted)}
@media (max-width:600px){.day{min-height:62px;padding:3px}.day span,.day .chip{font-size:10px;padding-left:2px;padding-right:2px}.day .chip .ip{display:none}.long{display:none}.tools{margin-left:0}}
@media print{@page{size:landscape;margin:8mm}nav,aside,.tools,#prev,#next,#now,#results,.small,h1{display:none!important}main{padding:0}.layout{display:block}.day{min-height:100px!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (min-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .day{min-height:max(84px,calc((100vh - 280px) / 6))}
  aside{border-top:0;border-left:1px solid var(--line);padding:0 0 0 24px;max-height:calc(100vh - 170px);overflow:auto}
}
</style></head><body>
<main>
  <h1>📅 달력</h1>
  <div class="layout">
    <section>
      <div class="bar">
        <button type="button" id="prev" aria-label="이전 달">◀</button>
        <h2 id="title" aria-live="polite"></h2>
        <button type="button" id="next" aria-label="다음 달">▶</button>
        <button type="button" id="now">오늘</button>
        <div class="tools">
          <input type="search" id="search" placeholder="일정 검색" aria-label="일정 검색">
          <button type="button" id="new">＋ 일정</button>
          <button type="button" id="print">인쇄</button>
          <button type="button" id="export">백업</button>
          <button type="button" id="import">불러오기</button>
          <input type="file" id="importfile" accept=".json,application/json" hidden>
        </div>
      </div>
      <p id="status" class="small" role="status"></p>
      <ul class="events" id="results" hidden></ul>
      <div class="grid" id="grid"></div>
      <p class="small">"점검 11/5"는 그날이 제출기한인 점검종료일입니다. 건수는 자체점검 페이지에 올려 둔 파일을 기준으로 합니다.<br>날짜를 두 번 누르면 일정을 추가합니다. 일정은 이 브라우저에만 저장됩니다. 일정 옆의 작은 숫자는 입력할 때의 IPv4 주소입니다.</p>
    </section>
    <aside id="detail" aria-live="polite"></aside>
  </div>
</main>
<dialog id="editor" aria-labelledby="etitle">
  <form id="form" novalidate>
    <h2 id="etitle">일정</h2>
    <label for="ftext">내용</label><input type="text" id="ftext" maxlength="100" autocomplete="off">
    <label for="fdate">날짜</label><input type="date" id="fdate" min="2026-01-01" max="2027-12-31">
    <label for="frepeat">반복</label>
    <select id="frepeat"><option value="">반복 안 함</option><option value="week">매주</option><option value="month">매월</option><option value="year">매년</option></select>
    <div id="untilbox"><label for="funtil">반복 종료일 (비우면 계속)</label><input type="date" id="funtil" min="2026-01-01" max="2027-12-31"></div>
    <label>색상</label><div class="swatches" id="swatches"></div>
    <p id="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="fdelete">삭제</button>
      <button type="button" class="primary" id="fcancel" style="background:#fff;color:inherit;border-color:var(--line)">취소</button>
      <button type="submit" id="save" class="primary" style="margin-left:0">저장</button>
    </div>
  </form>
</dialog>
<nav><a href="./">자체점검</a><a href="calendar.html" aria-current="page">달력</a><a href="form.html">양식</a></nav>
<script>
// 휴일 목록: 임시공휴일 등은 여기와 index.html의 HOLIDAYS에 함께 추가하세요.
const HOLIDAYS = {
  "2026-01-01":"신정","2026-02-16":"설날 연휴","2026-02-17":"설날","2026-02-18":"설날 연휴","2026-03-01":"삼일절","2026-03-02":"대체공휴일",
  "2026-05-01":"노동절","2026-05-05":"어린이날","2026-05-24":"부처님오신날","2026-05-25":"대체공휴일","2026-06-03":"지방선거일","2026-06-06":"현충일",
  "2026-07-17":"제헌절","2026-08-15":"광복절","2026-08-17":"대체공휴일","2026-09-24":"추석 연휴","2026-09-25":"추석","2026-09-26":"추석 연휴",
  "2026-10-03":"개천절","2026-10-05":"대체공휴일","2026-10-09":"한글날","2026-12-25":"성탄절",
  "2027-01-01":"신정","2027-02-06":"설날 연휴","2027-02-07":"설날","2027-02-08":"설날 연휴","2027-02-09":"대체공휴일","2027-03-01":"삼일절",
  "2027-05-01":"노동절","2027-05-03":"대체공휴일","2027-05-05":"어린이날","2027-05-13":"부처님오신날","2027-06-06":"현충일","2027-07-17":"제헌절",
  "2027-07-19":"대체공휴일","2027-08-15":"광복절","2027-08-16":"대체공휴일","2027-09-14":"추석 연휴","2027-09-15":"추석","2027-09-16":"추석 연휴",
  "2027-10-03":"개천절","2027-10-04":"대체공휴일","2027-10-09":"한글날","2027-10-11":"대체공휴일","2027-12-25":"성탄절","2027-12-27":"대체공휴일"
};
const parse = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const add = (d, n) => new Date(d.getTime() + n * 86400000);
const isBiz = d => d.getUTCDay() % 6 !== 0 && !HOLIDAYS[iso(d)];
function shiftBiz(d, n) {
  const step = Math.sign(n);
  for (let left = Math.abs(n); left > 0;) { d = add(d, step); if (isBiz(d)) left--; }
  return d;
}
function dueDates(d) {               // d가 제출기한인 점검종료일들 (자체점검 페이지와 같은 계산)
  if (!isBiz(d) || iso(d) < "2026-02-01") return [];
  const first = shiftBiz(d, -15), list = [first];
  for (let x = add(first, 1); !isBiz(x); x = add(x, 1)) list.push(x);
  return list;
}
const md = d => `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
const withDay = d => `${iso(d)} (${"일월화수목금토"[d.getUTCDay()]})`;

function loadRecords() {             // 자체점검 페이지에 저장한 파일 (중복은 한 번만)
  try {
    const most = new Map(), list = [];
    for (const f of JSON.parse(localStorage.getItem("selfcheck.files.v1") || "[]")) {
      const seen = new Map();
      for (const r of f.records) {
        const key = JSON.stringify([r.end, r.kind, r.name, r.address, r.company, r.phone]);
        seen.set(key, (seen.get(key) || 0) + 1);
        if (seen.get(key) > (most.get(key) || 0)) { most.set(key, seen.get(key)); list.push(r); }
      }
    }
    return list;
  } catch { return []; }
}
let records = loadRecords();
const itemsFor = dates => { const set = new Set(dates.map(iso)); return records.filter(r => set.has(r.end)); };

const $ = id => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const todayIso = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
const MIN = "2026-01", MAX = "2027-12";
let selected = todayIso(), month = selected.slice(0, 7);
if (month < MIN || month > MAX) { month = MAX; selected = MAX + "-01"; }

// ───── 일정 (DesktopCal 방식: 날짜별 입력, 색상, 반복, 완료) ─────
const EVENTS = "calendar.events.v1";
const COLORS = [["파랑","#dcebff","#0b4f8a"],["초록","#dcf4e1","#1b6b32"],["노랑","#fff2c2","#6b5200"],["빨강","#ffdede","#a11d25"],["보라","#ece2ff","#52309a"],["회색","#e9eaee","#31333f"]];
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parse(s)) && iso(parse(s)) === s;
const isIPv4 = s => typeof s === "string" && /^((25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(25[0-5]|2[0-4]\d|1?\d?\d)$/.test(s);
async function fetchIp() {           // 브라우저는 자기 공인 IP를 알 수 없어 외부 확인 서비스를 사용합니다
  try {
    const res = await fetch("https://api.ipify.org?format=json", { cache: "no-store", signal: AbortSignal.timeout(4000) });
    const { ip } = await res.json();
    return isIPv4(ip) ? ip : "";
  } catch { return ""; }
}
const ipTag = e => el("span", e.ip || "IP 확인 안 됨", "ip");
function clean(list) {               // 저장·백업 자료 중 올바른 일정만
  return (Array.isArray(list) ? list : []).filter(e => e && typeof e.id === "string" && typeof e.title === "string" && e.title && isDate(e.date)).map(e => ({
    id: e.id, title: e.title.slice(0, 100), date: e.date,
    repeat: ["week", "month", "year"].includes(e.repeat) ? e.repeat : "",
    until: isDate(e.until) ? e.until : "",
    color: Number.isInteger(e.color) && COLORS[e.color] ? e.color : 0,
    done: Array.isArray(e.done) ? e.done.filter(isDate) : [],
    ip: isIPv4(e.ip) ? e.ip : ""
  }));
}
function loadEvents() { try { return clean(JSON.parse(localStorage.getItem(EVENTS) || "[]")); } catch { return []; } }
let events = loadEvents();
function saveEvents() {
  try { localStorage.setItem(EVENTS, JSON.stringify(events)); $("status").textContent = ""; }
  catch { $("status").textContent = "일정을 저장하지 못했습니다. 새로고침하면 사라질 수 있습니다."; }
}
function occurs(e, key) {
  if (key < e.date) return false;
  if (!e.repeat) return key === e.date;
  if (e.until && key > e.until) return false;
  if (e.repeat === "week") return (parse(key) - parse(e.date)) % (7 * 86400000) === 0;
  return e.repeat === "month" ? key.slice(8) === e.date.slice(8) : key.slice(5) === e.date.slice(5);
}
const eventsOn = key => events.filter(e => occurs(e, key));
const paint = (node, e) => { node.style.background = COLORS[e.color][1]; node.style.color = COLORS[e.color][2]; };
const REPEAT = { week: "매주", month: "매월", year: "매년" };
function eventRow(e, key, label) {   // 목록 한 줄: 완료 체크 + 내용(누르면 수정)
  const li = el("li"), check = el("input"), open = el("button", label, "open" + (e.done.includes(key) ? " chip done" : ""));
  check.type = "checkbox"; check.checked = e.done.includes(key); check.setAttribute("aria-label", `${e.title} 완료`);
  check.onchange = () => { e.done = check.checked ? [...e.done, key] : e.done.filter(d => d !== key); saveEvents(); render(); };
  open.type = "button"; paint(open, e); open.onclick = () => edit(e, key);
  open.append(ipTag(e));
  li.append(check, open);
  return li;
}
let editing = null, ipRequest = null;
function edit(e, key) {
  editing = e;
  ipRequest = e ? null : fetchIp();   // 새로 입력할 때만 IP를 확인합니다
  $("save").disabled = false;
  $("etitle").textContent = e ? (e.repeat ? "반복 일정 수정 (전체 적용)" : "일정 수정") : "일정 추가";
  $("ftext").value = e?.title ?? "";
  $("fdate").value = e?.date ?? key;
  $("frepeat").value = e?.repeat ?? "";
  $("funtil").value = e?.until ?? "";
  $("untilbox").hidden = !$("frepeat").value;
  $("swatches").querySelectorAll("input")[e?.color ?? 0].checked = true;
  $("fdelete").hidden = !e; $("fdelete").textContent = e?.repeat ? "반복 전체 삭제" : "삭제"; delete $("fdelete").dataset.sure;
  $("error").textContent = "";
  $("editor").showModal(); $("ftext").focus();
}
$("swatches").append(...COLORS.map(([name, bg, fg], i) => {
  const label = el("label"), input = el("input"), chip = el("span", name);
  input.type = "radio"; input.name = "color"; input.value = i; chip.style.background = bg; chip.style.color = fg;
  label.append(input, chip); return label;
}));
$("frepeat").onchange = () => $("untilbox").hidden = !$("frepeat").value;
$("fcancel").onclick = () => $("editor").close();
$("editor").onclose = () => { if (!$("editor").open) ipRequest = null; };
$("form").onsubmit = async ev => {
  ev.preventDefault();
  const title = $("ftext").value.trim(), date = $("fdate").value, repeat = $("frepeat").value, until = repeat ? $("funtil").value : "";
  if (!title) return $("error").textContent = "내용을 입력하세요.";
  if (!isDate(date) || date < "2026-01-01" || date > "2027-12-31") return $("error").textContent = "2026~2027년 날짜를 선택하세요.";
  if (until && until < date) return $("error").textContent = "반복 종료일은 시작 날짜 이후여야 합니다.";
  const data = { title, date, repeat, until, color: +$("form").elements.color.value };
  if (editing) { if (editing.date !== date || editing.repeat !== repeat) editing.done = []; Object.assign(editing, data); }
  else {
    const request = ipRequest;
    $("save").disabled = true;
    let ip = await request;
    if (!ip) ip = await fetchIp();
    if (request !== ipRequest || !$("editor").open) return;   // 기다리는 동안 취소한 경우
    events.push({ id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`, ...data, done: [], ip });
  }
  saveEvents(); $("editor").close();
  selected = date; month = date.slice(0, 7); render();
};
$("fdelete").onclick = () => {     // 한 번 더 눌러야 삭제
  const b = $("fdelete");
  if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "한 번 더 누르면 삭제"; return; }
  events = events.filter(e => e !== editing); saveEvents(); $("editor").close(); render();
};
function search() {
  const q = $("search").value.trim().toLowerCase();
  $("results").hidden = !q;
  if (!q) return;
  const found = events.filter(e => e.title.toLowerCase().includes(q)).sort((a, b) => a.date.localeCompare(b.date));
  $("results").replaceChildren(...found.map(e => {
    const b = el("button", `${e.date} ${REPEAT[e.repeat] ? `(${REPEAT[e.repeat]}) ` : ""}${e.title}`, "open");
    b.type = "button"; paint(b, e); b.append(ipTag(e));
    b.onclick = () => { selected = e.date; month = e.date.slice(0, 7); $("search").value = ""; search(); render(); };
    const li = el("li"); li.append(b); return li;
  }));
  if (!found.length) $("results").append(el("li", "검색 결과가 없습니다."));
}
$("search").oninput = search;
$("new").onclick = () => edit(null, selected);
$("print").onclick = () => print();
$("export").onclick = () => {
  const a = el("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(events, null, 1)], { type: "application/json" }));
  a.download = `일정백업_${todayIso()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("import").onclick = () => $("importfile").click();
$("importfile").onchange = async () => {
  const file = $("importfile").files[0]; $("importfile").value = "";
  if (!file) return;
  try {
    const incoming = clean(JSON.parse(await file.text()));
    if (!incoming.length) throw new Error();
    const byId = new Map(events.map(e => [e.id, e]));
    incoming.forEach(e => byId.set(e.id, byId.get(e.id)?.ip ? { ...e, ip: byId.get(e.id).ip } : e));
    events = [...byId.values()]; saveEvents(); render();
    $("status").textContent = `일정 ${incoming.length}개를 불러왔습니다.`;
  } catch { $("status").textContent = "일정 백업 파일을 읽지 못했습니다."; }
};

function render() {
  const first = parse(month + "-01");
  $("title").textContent = `${month.slice(0, 4)}년 ${+month.slice(5)}월`;
  $("prev").disabled = month <= MIN; $("next").disabled = month >= MAX;
  const cells = [..."일월화수목금토"].map((w, i) => el("div", w, "head" + (i === 0 ? " sun" : i === 6 ? " sat" : "")));
  for (let i = 0; i < first.getUTCDay(); i++) cells.push(el("div"));
  for (let d = first; iso(d).startsWith(month); d = add(d, 1)) {
    const key = iso(d), week = d.getUTCDay(), holiday = HOLIDAYS[key];
    const b = el("button", null, "day" + (isBiz(d) ? "" : " off") + (key === todayIso() ? " today" : ""));
    b.type = "button"; b.dataset.date = key; b.setAttribute("aria-pressed", key === selected);
    b.append(el("b", d.getUTCDate(), holiday || week === 0 ? "sun" : week === 6 ? "sat" : ""));
    if (holiday) b.append(el("span", holiday, "sun"));
    const dates = dueDates(d);
    if (dates.length) {
      const line = el("span", null, "due");
      line.append(el("span", "점검 ", "long"), dates.length > 1 ? `${md(dates[0])}~${md(dates.at(-1))}` : md(dates[0]));
      const row = el("span", null, "duerow"); row.append(line);
      const n = itemsFor(dates).length;
      if (n) row.append(el("span", `${n}건`, "count"));
      b.append(row);
    }
    const own = eventsOn(key);
    own.slice(0, 3).forEach(e => { const chip = el("span", null, "chip" + (e.done.includes(key) ? " done" : "")); chip.append(el("span", e.title), ipTag(e)); paint(chip, e); b.append(chip); });
    if (own.length > 3) b.append(el("span", `+${own.length - 3}개 더`));
    b.onclick = () => select(key);
    b.ondblclick = () => edit(null, key);
    cells.push(b);
  }
  while (cells.length % 7) cells.push(el("div"));
  $("grid").replaceChildren(...cells);
  detail();
}
function select(key) {               // 달력을 다시 그리지 않아야 두 번 누르기가 동작합니다
  selected = key;
  $("grid").querySelectorAll(".day").forEach(b => b.setAttribute("aria-pressed", b.dataset.date === key));
  detail();
}
function detail() {
  const d = parse(selected), dates = dueDates(d), box = [el("h2", withDay(d))];
  if (HOLIDAYS[selected]) box.push(el("p", HOLIDAYS[selected], "sun"));
  box.push(el("h3", "일정"));
  const own = eventsOn(selected);
  if (own.length) {
    const ul = el("ul", null, "events");
    own.forEach(e => ul.append(eventRow(e, selected, (e.repeat ? "🔁 " : "") + e.title)));
    box.push(ul);
  } else box.push(el("p", "등록한 일정이 없습니다.", "small"));
  const addButton = el("button", "＋ 일정 추가"); addButton.type = "button"; addButton.onclick = () => edit(null, selected);
  box.push(addButton);
  box.push(el("h3", "제출해야 하는 보고서"));
  if (!dates.length) box.push(el("p", isBiz(d) ? "계산 범위 밖의 날짜입니다." : "주말·공휴일이라 제출 대상이 없습니다."));
  else {
    box.push(el("p", `${dates.map(withDay).join(", ")} 점검분`));
    const items = itemsFor(dates);
    if (items.length) {
      const ul = el("ul");
      items.sort((a, b) => a.name.localeCompare(b.name, "ko")).forEach(r => ul.append(el("li", `[${r.kind}] ${r.name}`)));
      box.push(el("p", `${items.length}건`, "count"), ul);
    } else box.push(el("p", records.length ? "올려 둔 파일에 해당 자료가 없습니다." : "자체점검 페이지에서 파일을 올리면 대상이 표시됩니다.", "small"));
  }
  box.push(el("h3", "이 날 시작하는 이행기간"));
  if (selected > "2027-11-30") box.push(el("p", "휴일 자료 범위 밖이라 계산하지 않습니다."));
  else {
    const ul = el("ul");
    for (const days of [10, 20]) {
      const end = add(d, days - 1);
      ul.append(el("li", `${days}일: ${iso(end)}까지, 결과보고 ${withDay(shiftBiz(end, 10))}`));
    }
    box.push(ul);
  }
  $("detail").replaceChildren(...box);
}
function move(step) {
  const d = parse(month + "-01"); d.setUTCMonth(d.getUTCMonth() + step);
  month = iso(d).slice(0, 7); selected = month + "-01"; render();
}
$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);
$("now").onclick = () => { const t = todayIso(); if (t.slice(0, 7) >= MIN && t.slice(0, 7) <= MAX) { selected = t; month = t.slice(0, 7); render(); } };
addEventListener("storage", () => { records = loadRecords(); events = loadEvents(); if ($("editor").open) $("editor").close(); render(); });
addEventListener("pageshow", () => { records = loadRecords(); render(); });
render();
</script>
</body></html>
